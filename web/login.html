<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · GPlanSiS|Studio</title>
<meta name="description" content="GPlanSiS|Studio — edição de imagem, ilustração vetorial e revelação de fotos.">
<meta name="theme-color" content="#1f2428" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8f9" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/plus/fonts.css">
<style>
:root{--bg:#e9ebed;--panel:#f7f8f9;--line:#c9ced3;--text:#1d2226;--muted:#5f676d;--accent:#b86e00;--accent-ink:#fff;--danger:#c0392b;--ok:#2e7d32;color-scheme:light;
 --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2428;--line:#384047;--text:#e3e6e8;--muted:#8e979d;--accent:#f6a709;--accent-ink:#1a1400;--danger:#ff6b5b;--ok:#6fcf74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2428;--line:#384047;--text:#e3e6e8;--muted:#8e979d;--accent:#f6a709;--accent-ink:#1a1400;--danger:#ff6b5b;--ok:#6fcf74;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:min(400px,100%)}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 22px}
.brand img{width:52px;height:52px;border-radius:12px}
.brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand h1 span{color:var(--accent);font-weight:500}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h2{margin:0;font-size:16px;font-weight:600}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer;border-radius:6px}
.go{font:inherit;font-weight:600;border:0;border-radius:8px;min-height:46px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.go:disabled{opacity:.6;cursor:progress}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0}
.note{color:var(--muted);font-size:12px;margin:14px 2px 0;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/icons/icon-192.png" alt="" width="52" height="52"><div><h1>GPlanSiS<span>|Studio</span></h1><p>Pixel · Vetor · Foto · Ponte</p></div></div>

  <form id="fLogin" autocomplete="on" novalidate>
    <h2>Entrar</h2>
    <label>E-mail<input id="email" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<span class="pw"><input id="password" type="password" name="password" autocomplete="current-password" required><button type="button" data-show="password">mostrar</button></span></label>
    <div class="err" id="e1" role="alert"></div>
    <button class="go" type="submit" id="b1">Entrar</button>
  </form>

  <form id="fChange" hidden novalidate>
    <h2>Defina a sua senha</h2>
    <p style="margin:0;color:var(--muted);font-size:13px">Primeiro acesso ou senha redefinida: escolha uma senha nova para continuar.</p>
    <label>Nova senha<span class="pw"><input id="new1" type="password" autocomplete="new-password" minlength="10" required><button type="button" data-show="new1">mostrar</button></span></label>
    <label>Confirmar<input id="new2" type="password" autocomplete="new-password" required></label>
    <div class="err" id="e2" role="alert"></div>
    <button class="go" type="submit" id="b2">Salvar e entrar</button>
  </form>

  <p class="note">Acesso restrito. Peça a conta a um administrador.</p>
</main>
<script>
(function(){
  try{var t=localStorage.getItem('gps.studio.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  var $=function(i){return document.getElementById(i)};var cur='';
  document.querySelectorAll('[data-show]').forEach(function(b){b.onclick=function(){var i=$(b.dataset.show);var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'ocultar':'mostrar'}});
  function post(url,body){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Studio':'1'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Erro '+r.status);return j})})}
  function enter(){location.replace('/')}
  $('fLogin').onsubmit=function(e){e.preventDefault();$('e1').textContent='';var em=$('email').value.trim(),pw=$('password').value;if(!em||!pw){$('e1').textContent='Informe e-mail e senha.';return}$('b1').disabled=true;
    post('/api/auth/login',{email:em,password:pw}).then(function(r){if(r.must_change){cur=pw;$('fLogin').hidden=true;$('fChange').hidden=false;$('new1').focus()}else enter()}).catch(function(er){$('e1').textContent=er.message}).finally(function(){$('b1').disabled=false})};
  $('fChange').onsubmit=function(e){e.preventDefault();$('e2').textContent='';if($('new1').value!==$('new2').value){$('e2').textContent='A confirmação não confere.';return}$('b2').disabled=true;
    post('/api/me/password',{current:cur,new:$('new1').value}).then(enter).catch(function(er){$('e2').textContent=er.message}).finally(function(){$('b2').disabled=false})};
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(function(){});
  setTimeout(function(){$('email').focus()},50);
})();
</script>
</body>
</html>

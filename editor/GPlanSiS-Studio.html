:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.35 var(--font);display:grid;grid-template-rows:auto 1fr auto;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* barra superior */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:44px;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#brand{display:flex;align-items:baseline;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
#brand span{color:var(--accent);font-weight:500}
#mods{display:flex;gap:2px;background:var(--panel2);padding:2px;border-radius:8px;margin-left:6px}
.modbtn{border:0;background:none;border-radius:6px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap}
.modbtn[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.modbtn .dot{width:8px;height:8px;border-radius:2px}
#topbtns{margin-left:auto;display:flex;gap:4px;align-items:center}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:30px}
.tb:hover{background:var(--panel2)}
.tb:disabled{opacity:.45;cursor:default}
.tb.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}
.tb.sm{min-height:26px;padding:3px 7px;font-size:12px}
.tb.on{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:760px){ .tb .lbl,.modbtn .lbl{display:none} }

/* módulos */
#app{position:relative;min-height:0}
.mod{position:absolute;inset:0;display:none;grid-template-rows:auto auto 1fr;min-height:0}
.mod.on{display:grid}
.mbar{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-height:32px}
.mbar::-webkit-scrollbar{display:none}
.mbtn{border:0;background:none;padding:5px 9px;border-radius:5px;white-space:nowrap}
.mbtn:hover,.mbtn.open{background:var(--panel2)}
.docs{display:flex;gap:2px;margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.doct{border:1px solid transparent;background:none;border-radius:5px;padding:3px 8px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-size:12px}
.doct.on{border-color:var(--line);background:var(--bg);color:var(--text)}
.doct i{font-style:normal;opacity:.6}
.doct i:hover{opacity:1;color:var(--danger)}
.opts{display:flex;align-items:center;gap:10px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:34px;white-space:nowrap;scrollbar-width:thin}
.opts label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.opts input[type=range]{width:92px}
.opts input[type=number]{width:62px}
.opts b{color:var(--text);font-weight:500;font-size:12px}
.opts .sep{width:1px;height:20px;background:var(--line)}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-height:26px}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:4px;padding:1px;background:var(--bg)}
.work{display:grid;grid-template-columns:auto 1fr auto;min-height:0}
.rail{display:flex;flex-direction:column;gap:2px;padding:6px 4px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none;width:46px;align-items:center}
.rail::-webkit-scrollbar{display:none}
.tool{border:1px solid transparent;background:none;border-radius:6px;width:36px;height:34px;display:grid;place-items:center;color:var(--text);position:relative;flex:0 0 auto}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent-soft);border-color:var(--accent)}
.tool svg.i{width:18px;height:18px}
.rail hr{width:26px;border:0;border-top:1px solid var(--line);margin:4px 0}
.wells{position:relative;width:36px;height:40px;margin-top:6px;flex:0 0 auto}
.well{position:absolute;width:22px;height:22px;border:1px solid var(--line);border-radius:4px;box-shadow:0 0 0 1px var(--panel)}
.well.fg{left:0;top:0;z-index:2}
.well.bg{right:0;bottom:0}
.well input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.swapw{position:absolute;right:-2px;top:-3px;font-size:11px;border:0;background:none;padding:0;color:var(--muted)}
.stage{position:relative;overflow:hidden;background:var(--stage);touch-action:none;min-width:0;min-height:0}
.stage canvas.view{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.vsvg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.dock{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dtabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.dtab{border:0;background:none;padding:7px 8px 6px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-size:12px}
.dtab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.dpanes{flex:1;overflow-y:auto;min-height:0}
.dpane{display:none;padding:8px 10px}
.dpane.on{display:block}
.sec{border-bottom:1px solid var(--line);padding:8px 0}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec h4 .r{margin-left:auto;display:flex;gap:4px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row>label{color:var(--muted);font-size:12px;min-width:64px}
.mini{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 6px;min-height:24px;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.mini:hover{background:var(--panel2)}
.mini.on{background:var(--accent-soft);border-color:var(--accent)}
.mini svg.i{width:14px;height:14px}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-size:11px}
.dockToggle{display:none}
.opts .dockToggle{position:sticky;right:0;background:var(--panel);box-shadow:-10px 0 10px var(--panel)}

/* lista de camadas/objetos */
.list{display:flex;flex-direction:column;gap:2px}
.li{display:grid;grid-template-columns:22px 40px 1fr auto;align-items:center;gap:6px;padding:3px 4px;border-radius:5px;border:1px solid transparent;cursor:pointer;min-height:36px}
.li:hover{background:var(--panel2)}
.li.on{background:var(--accent-soft);border-color:var(--accent)}
.li canvas,.li .th{width:40px;height:30px;border:1px solid var(--line);border-radius:3px;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/8px 8px;display:block}
.li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.li .nm small{display:block;color:var(--muted);font-size:10.5px}
.li .eye{border:0;background:none;padding:0;color:var(--muted);display:grid;place-items:center}
.li .eye.off{opacity:.35}
.li .tags{display:flex;gap:3px;align-items:center}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.tag.a{border-color:var(--accent);color:var(--accent)}
.li .mk{width:26px;height:22px}
.li .mk.on{outline:2px solid var(--accent)}
.fxl{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.fxi{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px}
.fxi.off{opacity:.5}
.fxi span{flex:1}
.fxi button{border:0;background:none;padding:0 2px;color:var(--muted)}
.fxi button:hover{color:var(--text)}
.hist{display:flex;flex-direction:column;gap:1px;font-size:12px}
.hist div{padding:3px 6px;border-radius:4px;cursor:pointer}
.hist div:hover{background:var(--panel2)}
.hist div.on{background:var(--accent-soft)}
.hist div.fut{opacity:.45}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.sw button{height:22px;border:1px solid var(--line);border-radius:3px;padding:0}

/* menus suspensos */
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:0 8px 26px rgba(0,0,0,.22);padding:4px;min-width:220px;max-height:80vh;overflow-y:auto}
.menu button{display:flex;width:100%;border:0;background:none;padding:6px 10px;border-radius:5px;text-align:left;gap:10px;align-items:center;white-space:nowrap}
.menu button:hover{background:var(--panel2)}
.menu button:disabled{opacity:.4}
.menu button kbd{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .mh{font-size:11px;color:var(--muted);padding:6px 10px 2px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.3);width:min(460px,100%);max-height:88vh;display:flex;flex-direction:column}
.dlg.wide{width:min(820px,100%)}
.dlg h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.dlg .bd{padding:12px 14px;overflow-y:auto}
.dlg .ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.fld{display:grid;grid-template-columns:130px 1fr 56px;gap:8px;align-items:center;margin:6px 0}
.fld>span:first-child{color:var(--muted);font-size:12px}
.fld input[type=range]{width:100%}
.fld .v{font:11px var(--mono);text-align:right;color:var(--muted)}
.fld.full{grid-template-columns:130px 1fr}
.fld textarea{width:100%;min-height:64px}
.fld input[type=text],.fld select{width:100%}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:auto;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.err{background:var(--danger);color:#fff}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 8px}

/* status */
#status{display:flex;gap:14px;align-items:center;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;min-height:24px}
#status .msg{margin-left:auto;overflow:hidden;text-overflow:ellipsis;font-family:var(--font)}

/* Foto */
.fwork{display:grid;grid-template-columns:240px 1fr 300px;min-height:0}
.fleft{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px 10px}
.fcenter{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
.fstage{position:relative;background:var(--stage-foto);overflow:hidden;touch-action:none;min-height:0}
.fstage canvas{position:absolute;inset:0;width:100%;height:100%}
.fbar{display:flex;gap:6px;align-items:center;padding:5px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.fright{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.acc{border-bottom:1px solid var(--line)}
.acc>summary{list-style:none;padding:8px 10px;font-weight:600;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::before{content:"▸";color:var(--muted);font-size:10px;width:10px}
.acc[open]>summary::before{content:"▾"}
.acc>summary .r{margin-left:auto}
.acc .in{padding:0 10px 10px}
.sl{display:grid;grid-template-columns:86px 1fr 40px;gap:6px;align-items:center;margin:3px 0}
.sl span{font-size:12px;color:var(--muted)}
.sl input[type=range]{width:100%}
.sl input[type=number]{width:40px;padding:1px 2px;min-height:20px;font:11px var(--mono);text-align:right;border-color:transparent;background:none}
.sl input[type=number]:focus{border-color:var(--line);background:var(--bg)}
.sl.temp input[type=range]{background:linear-gradient(90deg,#4f7fd0,#e0e0e0,#e3b74a);height:4px;border-radius:2px;appearance:none;-webkit-appearance:none}
.sl.tint input[type=range]{background:linear-gradient(90deg,#4fbf5a,#e0e0e0,#c94fc4);height:4px;border-radius:2px;appearance:none;-webkit-appearance:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px;overflow-y:auto;align-content:start;background:var(--stage-foto)}
.cell{background:var(--panel);border:2px solid transparent;border-radius:6px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.cell.on{border-color:var(--accent)}
.cell canvas{width:100%;aspect-ratio:3/2;object-fit:contain;background:#222;border-radius:3px;display:block}
.cell .cm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.cell .cm .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{color:var(--accent);letter-spacing:1px;font-size:11px}
.lbl-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.flag{font-size:11px}
.histo{width:100%;height:96px;display:block;background:#1b1b1b;border-radius:4px}
.curve{width:100%;aspect-ratio:1;display:block;background:var(--bg);border:1px solid var(--line);border-radius:4px;touch-action:none}
.preset{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:4px;font-size:12px}
.preset:hover{background:var(--panel2)}
.ptabs{display:flex;gap:2px;margin-bottom:6px}

/* Ponte */
.pwork{display:grid;grid-template-columns:220px 1fr;min-height:0}
.pnav{background:var(--panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.pnav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;display:flex;gap:8px;align-items:center}
.pnav button:hover{background:var(--panel2)}
.pnav button.on{background:var(--accent-soft);color:var(--text);font-weight:500}
.pmain{overflow-y:auto;padding:16px 20px;min-width:0}
.pmain h2{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.pmain .lead{color:var(--muted);margin:0 0 14px;max-width:72ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{color:var(--muted);font-weight:500}
.st-ok{color:var(--ok)} .st-w{color:var(--warn)} .st-x{color:var(--danger)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.asset{border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.asset .pv{height:70px;border-radius:4px;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/10px 10px;display:grid;place-items:center;overflow:hidden}
.asset .pv img,.asset .pv canvas{max-width:100%;max-height:100%}
.asset .ac{display:flex;gap:3px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.step .n{font:11px var(--mono);color:var(--muted);width:18px}
.step .d{flex:1;font-size:12px}
.step .d small{color:var(--muted);display:block}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pal{display:flex;gap:4px;flex-wrap:wrap}
.pal span{width:34px;height:34px;border-radius:5px;border:1px solid var(--line)}
.prevbox{background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;min-height:220px;overflow:hidden}
.prevbox canvas,.prevbox svg,.prevbox img{max-width:100%;max-height:340px}

/* responsivo */
@media (max-width:980px){
  .dock,.fright{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .18s}
  .dock.open,.fright.open{transform:none}
  .work,.fwork{grid-template-columns:auto 1fr}
  .fwork{grid-template-columns:1fr}
  .fleft{display:none}
  .fleft.open{display:block;position:absolute;left:0;top:0;bottom:0;z-index:30;width:240px;box-shadow:8px 0 24px rgba(0,0,0,.25)}
  .dockToggle{display:inline-flex}
  .fwork{position:relative}
  .work{position:relative}
  .pwork{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .pnav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .pnav button{white-space:nowrap}
  .two{grid-template-columns:1fr}
}
@media (max-width:560px){
  .work{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{flex-direction:row;width:auto;border-right:0;border-top:1px solid var(--line);overflow-x:auto;order:2;padding:4px 6px}
  .rail hr{width:1px;height:26px;border:0;border-left:1px solid var(--line);margin:0 4px}
  .wells{margin:0 4px}
  .stage{order:1}
  .fld{grid-template-columns:100px 1fr 46px}
}
@media (prefers-reduced-motion: reduce){ .dock,.fright{transition:none} }
</style>
</head>
<body>
<header id="top">
  <div id="brand"><b>GPlanSiS</b><span>|Studio</span></div>
  <nav id="mods" aria-label="Módulos">
    <button class="modbtn" data-mod="pixel" aria-pressed="true" title="Pixel — edição de imagem (1)"><span class="dot" style="background:#3a86d9"></span><span class="lbl">Pixel</span></button>
    <button class="modbtn" data-mod="vetor" aria-pressed="false" title="Vetor — ilustração vetorial (2)"><span class="dot" style="background:#d9822b"></span><span class="lbl">Vetor</span></button>
    <button class="modbtn" data-mod="foto" aria-pressed="false" title="Foto — catálogo e revelação (3)"><span class="dot" style="background:#3faa6b"></span><span class="lbl">Foto</span></button>
    <button class="modbtn" data-mod="ponte" aria-pressed="false" title="Ponte — integração dos três módulos (4)"><span class="dot" style="background:#9a6bd1"></span><span class="lbl">Ponte</span><span class="tag w" id="linkBadge" hidden>0</span></button>
  </nav>
  <div id="topbtns">
    <button class="tb" id="bUndo" title="Desfazer (Ctrl+Z)"></button>
    <button class="tb" id="bRedo" title="Refazer (Ctrl+Shift+Z)"></button>
    <button class="tb" id="bProj" title="Projeto"><span class="ico"></span><span class="lbl">Projeto</span></button>
    <button class="tb primary" id="bDemo" title="Demonstração integrada"><span class="ico"></span><span class="lbl">Demonstração</span></button>
    <button class="tb" id="bTheme" title="Tema claro/escuro"></button>
    <button class="tb" id="bHelp" title="Atalhos (?)"></button>
  </div>
</header>
<main id="app">
  <!-- PIXEL -->
  <section class="mod on" id="m-pixel">
    <div class="mbar" id="px-mbar"></div>
    <div class="opts" id="px-opts"></div>
    <div class="work">
      <aside class="rail" id="px-rail"></aside>
      <div class="stage" id="px-stage"><canvas class="view" id="px-cv"></canvas></div>
      <aside class="dock" id="px-dock"></aside>
    </div>
  </section>
  <!-- VETOR -->
  <section class="mod" id="m-vetor">
    <div class="mbar" id="vx-mbar"></div>
    <div class="opts" id="vx-opts"></div>

function formModal(title,fields,{live,ok='Aplicar',wide,extra}={}){const vals={};const form=el('div');const emit=()=>live&&live({...vals});for(const f of fields){vals[f.k]=f.value;if(f.type==='html'){form.append(el('div',{html:f.html}));continue}const row=el('label',{class:'fld'+(['text','select','textarea','color','check'].includes(f.type)?' full':'')});row.append(el('span',null,f.label));let inp,vv=null;if(f.type==='range'){inp=el('input',{type:'range',min:f.min,max:f.max,step:f.step||1,value:f.value});vv=el('span',{class:'v'},fmtv(f.value,f.step));inp.oninput=()=>{vals[f.k]=+inp.value;vv.textContent=fmtv(inp.value,f.step);emit()}}else if(f.type==='number'){inp=el('input',{type:'number',min:f.min,max:f.max,step:f.step||1,value:f.value});inp.oninput=()=>{vals[f.k]=+inp.value;emit()}}else if(f.type==='select'){inp=el('select');for(const o of f.opts){const[v,l]=Array.isArray(o)?o:[o,o];inp.append(el('option',{value:v,selected:String(v)===String(f.value)},l))}inp.onchange=()=>{vals[f.k]=inp.value;emit()}}else if(f.type==='check'){inp=el('input',{type:'checkbox',checked:!!f.value});inp.onchange=()=>{vals[f.k]=inp.checked;emit()};row.style.gridTemplateColumns='130px auto'}else if(f.type==='color'){inp=el('input',{type:'color',value:f.value});inp.oninput=()=>{vals[f.k]=inp.value;emit()}}else if(f.type==='textarea'){inp=el('textarea',null,f.value||'');inp.oninput=()=>{vals[f.k]=inp.value;emit()}}else{inp=el('input',{type:'text',value:f.value??''});inp.oninput=()=>{vals[f.k]=inp.value;emit()}}row.append(inp);if(vv)row.append(vv);form.append(row)}if(extra)form.append(extra);setTimeout(emit,0);return modal({title,body:form,wide,buttons:[{label:'Cancelar',value:null},{label:ok,primary:true,value:'ok'}]}).then(r=>r==='ok'?vals:null)}

 else if(kind==='mar'){sky([[0,'#5b8fc4'],[.5,'#c9dcea'],[.52,'#3d6f93'],[1,'#173a55']]);for(let i=0;i<260;i++){const y=H*.52+Math.pow(R(),1.6)*H*.48;x.fillStyle=`rgba(255,255,255,${.08+R()*.15})`;x.fillRect(R()*W,y,20+R()*80,1+R()*2)}ridge(H*.53,H*.12,2.5,'#4a6a5b',4.2);x.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<5;i++){x.beginPath();x.ellipse(R()*W,H*(.1+R()*.25),80+R()*120,18+R()*20,0,0,7);x.fill()}}

 else if(kind==='floresta'){sky([[0,'#9fb7a0'],[.5,'#d8e2c8'],[1,'#3b5a2d']]);for(let l=0;l<4;l++){const col=['#6f8f68','#4d6d47','#34502f','#1f3519'][l];x.fillStyle=col;for(let i=0;i<34;i++){const tx=R()*W,th=H*(.25+l*.12+R()*.15),tw=th*.35,ty=H*(.55+l*.12);x.beginPath();x.moveTo(tx,ty-th);x.lineTo(tx-tw/2,ty);x.lineTo(tx+tw/2,ty);x.closePath();x.fill()}}x.fillStyle='rgba(255,250,220,.18)';x.fillRect(0,0,W,H)}

function traceNodes(pts,smooth){const n=pts.length;if(smooth<=0)return pts.map(p=>N(p.x,p.y));return pts.map((p,i)=>{const a=pts[(i-1+n)%n],b=pts[(i+1)%n];const v1x=p.x-a.x,v1y=p.y-a.y,v2x=b.x-p.x,v2y=b.y-p.y;const L1=Math.hypot(v1x,v1y)||1,L2=Math.hypot(v2x,v2y)||1;const cos=(v1x*v2x+v1y*v2y)/(L1*L2);if(cos<.1-smooth*.6)return N(p.x,p.y);const tx=(b.x-a.x)/6*smooth*1.4,ty=(b.y-a.y)/6*smooth*1.4;return{x:p.x,y:p.y,ix:p.x-tx,iy:p.y-ty,ox:p.x+tx,oy:p.y+ty}})}

  const sym={id:uid(),kind:'symbol',name:'Selo',objs:JSON.parse(JSON.stringify(d.objs)),box:{x:0,y:0,w:d.w,h:d.h},ver:1};S.lib.push(sym);PONTE.thumbFor(sym);FLOW.name='Demonstração';FLOW.steps=[{t:'preset',id:'p-viv'},{t:'watermark',kind:'symbol',sym:sym.id,pos:'br',scale:14,op:.9},{t:'resize',edge:1600},{t:'format',f:'image/jpeg',q:.88,n:'{nome}_fluxo'}];FLOW.out='cat';PONTE.go('flows');await step('7/7 · Fluxo em lote: predefinição + selo do Vetor como marca d’água',1200);const ps=FXS.photos.filter(q=>!/fluxo/.test(q.name)).slice(0,3);for(let i=0;i<ps.length;i++){if(DEMO.stop)throw'stop';status(`Processando ${i+1}/${ps.length}…`);await sleep(20);const r=await runFlowOn(ps[i],FLOW.steps,i);fxAddPhoto(r.c,r.name.replace(/\.[^.]+$/,''))}markDirty();setMod('foto');FXS.view='lib';FXS.sel=new Set();fxUI();await step('Três novas fotos entraram no catálogo, com o selo aplicado',1200);toast('Demonstração concluída. Tudo continua editável: use Ctrl+Z em cada módulo.')}
